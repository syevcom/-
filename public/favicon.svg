<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Clean white rounded background for crisp browser tab contrast -->
  <rect width="120" height="120" rx="26" fill="#FFFFFF"/>
  <rect width="116" height="116" x="2" y="2" rx="24" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Stylized SY Navy Brand Text -->
  <!-- Bold 'S' and 'Y' -->
  <text x="14" y="65" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#0D2063" letter-spacing="-3">SY</text>
  
  <!-- '.com' underneath SY -->
  <text x="16" y="94" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#0D2063" letter-spacing="-1">.com</text>
  
  <!-- Stylized Navy Car + Vibrant Eco Leaf (as in the official SY logo) -->
  <g transform="translate(68, 44)">
    <!-- Car body in deep navy -->
    <path d="M4 28 C5 22, 9 17, 16 16 L28 16 C34 16, 38 20, 42 27 L45 29 C46 30, 46 32, 45 33 L45 35 C45 36, 44 37, 42 37 L38 37 C38 35, 36 33, 33 33 C30 33, 28 35, 28 37 L16 37 C16 35, 14 33, 11 33 C8 33, 6 35, 6 37 L2 37 C1 37, 0 36, 0 34 L0 32 C0 30, 2 29, 4 28 Z" fill="#0D2063"/>
    
    <!-- Car window glass -->
    <path d="M16 18 L26 18 C30 18, 33 21, 35 26 L12 26 C13 22, 14 19, 16 18 Z" fill="#FFFFFF"/>
    
    <!-- Wheels in deep navy & inner dot -->
    <circle cx="11" cy="37" r="5" fill="#0D2063"/>
    <circle cx="11" cy="37" r="2" fill="#FFFFFF"/>
    <circle cx="33" cy="37" r="5" fill="#0D2063"/>
    <circle cx="33" cy="37" r="2" fill="#FFFFFF"/>
    
    <!-- Eco Leaf sprouting from top right of car in bright eco green -->
    <path d="M30 14 C30 14, 38 12, 43 5 C44 3, 45 0, 45 0 C45 0, 42 4, 36 6 C32 7, 29 11, 30 14 Z" fill="#78C236"/>
    <path d="M43 5 C39 7, 36 10, 35 14 C35 14, 39 12, 43 5 Z" fill="#62A32B"/>
    <path d="M36 11 C40 10, 44 6, 44 6" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round"/>
  </g>
</svg>
